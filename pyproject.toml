[project]
name = "rtda"
version = "0.1.0"
description = "Reasoning-Trace Disagreement Analysis (RTDA): disagreement patterns for uncertainty-aware content moderation (CIKM '26)."
authors = [{ name = "Michal Wawer" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "sentence-transformers>=3.0",
    "datasets>=2.19",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "tqdm>=4.66",
    "httpx>=0.27",
    "pyarrow>=16.0",
    "torch>=2.4",
    "transformers>=4.44",
    "matplotlib>=3.9",
    "tabulate (>=0.10.0,<0.11.0)",
]

[project.scripts]
rtda = "rtda.cli:app"

[tool.poetry]
packages = [{ include = "rtda" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
ruff = ">=0.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
