data:
  # Measuring Hate Speech corpus (Kennedy et al. 2020; Sachdeva et al. 2022) - raw per-annotator ratings.
  hf_dataset: ucberkeley-dlab/measuring-hate-speech
  hf_split: train
  item_id_column: comment_id
  text_column: text
  annotator_column: annotator_id
  # Ordinal per-annotator rating used for the human-disagreement target d_h(c).
  rating_column: hatespeech
  rating_min: 0
  rating_max: 2
  min_annotators: 3
  n_train: 200      # supervised-training set (B6 only)
  n_cal: 200        # calibration set (threshold selection only)
  n_test: 1000      # held-out test set (evaluated once, after freezing thresholds)
  stratify: majority_rating
  # Items in the top quartile of d_h are "high annotator-disagreement" (routing label).
  high_disagreement_quantile: 0.75

llm:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  headline_model: openai/gpt-5.4-nano
  ablation_models:
    - anthropic/claude-sonnet-4.5
    - minimax/minimax-m3
  temperature: 0.7
  reasoning_effort: null  # null = provider default
  max_tokens: 4000        # includes hidden reasoning tokens
  concurrency: 8
  max_retries: 4          # transport-level retries (429 / 5xx / timeouts)
  parse_retries: 2        # re-ask on schema/JSON validation failure
  timeout_s: 120
  provider_order: []      # optional OpenRouter provider pinning

prompts:
  path: configs/prompts/v1.yaml
  # Fields concatenated into the embedded reasoning trace r_i (decision/confidence excluded).
  trace_fields: [interpretation, considerations, trade_offs, judgment]

panel:
  perspectives:
    - harm_focused
    - context_sensitive
    - community_norms
    - free_expression
    - legal_framework

embeddings:
  model: sentence-transformers/all-mpnet-base-v2
  batch_size: 32
  device: null            # auto

taxonomy:
  tau_a: 0.80             # fixed a priori: >= 4 of 5 agents agree
  tau_s_candidates: [0.60, 0.65, 0.68, 0.70, 0.72, 0.75, 0.78, 0.80, 0.85]
  escalate_m_candidates: [1, 2, 3]
  tiebreak_eps: 1.0e-6
  fallback_state_order: [CA, DA, DD, CD]

baselines:
  single_agent_perspective: neutral
  k_samples: 10                       # B4 / B5: K sampled completions per item
  b3_sample_index: 0                  # B3 uses the verbalized confidence of this neutral sample
  nli_model: microsoft/deberta-large-mnli   # B5: bidirectional entailment (Kuhn et al. 2023)
  nli_batch_size: 16
  nli_device: null
  nli_require_same_decision: true
  b6:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 7
    min_child_samples: 10
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    features: [s_mean, s_min, s_max, s_var, q, vote_entropy, conf_mean, conf_std]

evaluation:
  ci_level: 0.95
  n_bootstrap: 10000

ablations:
  # Agent-composition ablation; defined in rtda/agents/compositions.py.
  compositions:
    - full_5
    - k3_drop_legal_community
    - k7_add_procedural_victim
    - random_swap
    - drop_harm_focused
    - drop_free_expression
    - no_differentiation
  extra_perspectives: [procedural, victim_centered]
